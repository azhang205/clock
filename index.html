<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

/* DEFAULT THEME VARIABLES */
:root{
  --bg:#101114;
  --card:#1b1c20;
  --face:#292a2f;
  --text:#f4f4f4;
  --accent:rgb(62,0,138); /* your preferred default */
}

/* LIGHT THEME — improved */
body.light {
  --bg:#f5f5f5;
  --card:#ffffff;
  --face:#ffffff;
  --text:#000000;
  --accent:#4a90ff;
}

/* SPACE THEME — accent NOT overridden */
body.space {
  --bg:#030314;
  --card:#0b0c18;
  --face:#111222;
  --text:#d8e6ff;
}

/* STARFIELD LAYER */
#starfield {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity .6s;
}

body.space #starfield {
  opacity: 1;
}

#starfield canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* SEASONAL THEME */
body.seasonal.summer{
  --bg:#79c9ff; --card:#ffffffdd; --face:#ffffff; --text:#17384a;
  background:linear-gradient(to bottom,#69c5ff 0%,#bdeaff 62%,#5da84d 62%,#3f8739 100%) !important;
}
body.seasonal.fall{
  --bg:#c77c4f; --card:#fff8efee; --face:#fffaf3; --text:#4b2b1c;
  background:linear-gradient(to bottom,#b66b50 0%,#dfa16b 62%,#8a593d 62%,#63402f 100%) !important;
}
body.seasonal.winter{
  --bg:#edf7ff; --card:#fffffff0; --face:#ffffff; --text:#29465b;
  background:linear-gradient(to bottom,#d9ecfb 0%,#f9fcff 70%,#ffffff 70%,#e7f0f5 100%) !important;
}
body.seasonal.spring{
  --bg:#c8dce0; --card:#fafff8ee; --face:#fafff8; --text:#304631;
  background:linear-gradient(to bottom,#b8d5dd 0%,#e2eee2 62%,#68a258 62%,#4b8244 100%) !important;
}
#seasonalEffects{
  position:fixed; inset:0; width:100vw; height:100vh;
  z-index:1; pointer-events:none;
}
#seasonalCanvas{width:100%;height:100%;display:block}
body.seasonal #seasonalEffects{display:block}
body:not(.seasonal) #seasonalEffects{display:none}

.theme-select-wrap{
  display:flex; align-items:center; gap:6px;
  border:1px solid #444; background:var(--card); color:var(--text);
  border-radius:9px; padding:0 9px;
}
.theme-select-wrap span{font-size:13px;opacity:.7}
.theme-select-wrap select{
  border:0; outline:0; background:transparent; color:var(--text);
  padding:9px 2px; cursor:pointer;
}
.theme-select-wrap select option{background:white;color:black}

/* BASE BODY */
body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:.4s;
}

.app{width:min(1600px,98vw);text-align:center;transition:.4s}

/* TOP BAR */
.topbar{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  align-items:center;
  z-index:20;
}

/* BUTTONS */
button,select,input{font:inherit}
button{
  border:1px solid #444;
  background:var(--card);
  color:var(--text);
  border-radius:9px;
  padding:9px 12px;
  cursor:pointer;
  transition:.25s;
}
button:hover{
  filter:brightness(1.15);
  box-shadow:0 0 12px var(--accent);
  border-color:var(--accent);
}

/* CONTROLS */
.controls{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  z-index:20;
}

/* CLOCK LAYOUT */
.clock{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(8px,1.5vw,24px);
  width:100%;
}

.group{display:flex;gap:clamp(5px,.9vw,12px);flex:0 0 auto}

/* SEPARATOR */
.sep{
  font-size:clamp(50px,10vw,145px);
  font-weight:900;
  margin-top:-14px;
  color:var(--accent);
  text-shadow:0 0 18px var(--accent);
}

/* DIGIT BOX */
.digit{
  width:clamp(75px,13vw,190px);
  height:clamp(105px,18vw,255px);
  position:relative;
  overflow:hidden;
}

/* DIGIT FACE */
.digitFace{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(78px,13vw,185px);
  font-weight:900;
  background:var(--face);
  color:var(--text);
  border-radius:9px;
  border:3px solid var(--accent);
  box-shadow:0 4px 10px rgba(0,0,0,.15), 0 0 18px var(--accent);
}

/* LIGHT MODE GRADIENT */
body.light .digitFace,
body.light .flipDrop {
  background: linear-gradient(#ffffff, #e9e9e9);
}

/* FLIP PIECE */
.flipDrop{
  position:absolute;
  left:0;
  right:0;
  top:-100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(78px,13vw,185px);
  font-weight:900;
  background:var(--face);
  color:var(--text);
  border-radius:9px;
  border:3px solid var(--accent);
  box-shadow:0 4px 10px rgba(0,0,0,.15), 0 0 18px var(--accent);
  transform-origin:bottom;
  transform:rotateX(90deg);
}

/* FLIP ANIMATION */
@keyframes dropFlip {
  0% { top:-100%; transform:rotateX(90deg); }
  100% { top:0; transform:rotateX(0deg); }
}
.animate .flipDrop{
  animation:dropFlip .45s cubic-bezier(.2,.7,.2,1) forwards;
}

/* DATE + STATUS */
.date{margin-top:22px;font-size:clamp(16px,2.3vw,28px);opacity:.8}
.status{margin-top:8px;opacity:.45;font-size:13px}

/* SETTINGS PANEL */
.panel{
  position:fixed;
  right:18px;
  top:65px;
  width:250px;
  background:var(--card);
  border:1px solid var(--accent);
  border-radius:14px;
  padding:15px;
  text-align:left;
  display:none;
  box-shadow:0 15px 40px #0008;
  z-index:30;
}
.panel.open{display:block}
.panel label{display:block;margin:10px 0 5px;font-size:13px;opacity:.75}
.panel input,.panel select{
  width:100%;
  padding:8px;
  background:#222;
  color:white;
  border:1px solid #555;
  border-radius:7px;
}

/* TIMER */
.timer{font-size:clamp(16px,2vw,22px);margin-top:15px;display:none}
.timer.show{display:block}

</style>
</head>
<body>

<!-- STARFIELD -->
<div id="starfield"><canvas id="stars"></canvas></div>
<div id="seasonalEffects"><canvas id="seasonalCanvas"></canvas></div>

<div class="topbar">
  <button id="settingsBtn">⚙ Settings</button>
  <button id="fullscreenBtn">⛶ Fullscreen</button>
</div>

<div class="app">
  <div class="clock" id="clock">
    <div class="group"><div class="digit" data-i="0"></div><div class="digit" data-i="1"></div></div>
    <div class="sep">:</div>
    <div class="group"><div class="digit" data-i="2"></div><div class="digit" data-i="3"></div></div>
    <div class="sep secondsSep">:</div>
    <div class="group seconds"><div class="digit" data-i="4"></div><div class="digit" data-i="5"></div></div>
  </div>
  <div class="date" id="date"></div>
  <div class="status" id="status">Local time</div>
  <div class="timer" id="timer"></div>
</div>

<div class="controls">
  <button id="formatBtn">12 / 24h</button>
  <button id="secondsBtn">Seconds: ON</button>
  <button id="dateBtn">Date: ON</button>
  <label class="theme-select-wrap">
    <span>Theme</span>
    <select id="themeSelect">
      <option value="default">Default</option>
      <option value="light">Light</option>
      <option value="space">Space</option>
      <option value="seasonal">Seasonal</option>
    </select>
  </label>
  <button id="schoolSyncBtn">School Clock Sync</button>
  <button id="stopwatchBtn">Stopwatch</button>
  <button id="countdownBtn">Countdown</button>
</div>

<div class="panel" id="panel">
  <b>Clock Settings</b>
  <label>Accent color</label>
  <input type="color" id="accent" value="#3e008a">
  <label>Time zone</label>
  <select id="zone">
    <option value="local">Local time</option>
    <option value="America/New_York">New York</option>
    <option value="America/Chicago">Chicago</option>
    <option value="America/Denver">Denver</option>
    <option value="America/Los_Angeles">Los Angeles</option>
    <option value="Europe/London">London</option>
    <option value="Europe/Paris">Paris</option>
    <option value="Asia/Tokyo">Tokyo</option>
    <option value="Australia/Sydney">Sydney</option>
  </select>
  <label>Clock scale</label>
  <input type="range" id="scale" min=".65" max="1.35" step=".01" value="1">
</div>

<script>
/* STARFIELD CANVAS */
function initStars() {
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  resize();
  window.addEventListener("resize", () => {
    resize();
    regenerateStars();
  });

  document.addEventListener("fullscreenchange", () => {
    resize();
    regenerateStars();
  });

  const stars = [];
  const count = 250;

  function regenerateStars() {
    stars.length = 0;
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.8 + 0.2,
        o: Math.random() * 0.8 + 0.2
      });
    }
  }

  regenerateStars();

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      ctx.fillStyle = `rgba(255,255,255,${s.o})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  draw();
}

initStars();

/* CLOCK LOGIC */
const digits=[...document.querySelectorAll('.digit')];
let use24=false, showSeconds=true, showDate=true;
let schoolSync=false;
let currentTheme='default';
let currentSeason='';
let schoolOffset=16;
let zone='local';
let previous="";

/* TICK SOUND */
const tickAudio = new AudioContext();
function tick() {
  const osc = tickAudio.createOscillator();
  const gain = tickAudio.createGain();

  osc.connect(gain);
  gain.connect(tickAudio.destination);

  osc.frequency.value = 2000;

  const t = tickAudio.currentTime;

  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.04, t + 0.015);
  gain.gain.linearRampToValueAtTime(0.0, t + 0.12);

  osc.start(t);
  osc.stop(t + 0.15);
}

function makeDigit(el,n){
  el.innerHTML = `
    <div class="digitFace">${n}</div>
    <div class="flipDrop">${n}</div>
  `;
}
digits.forEach(d=>makeDigit(d,"0"));

function setDigit(el,n,animate){
  const face = el.querySelector('.digitFace');
  const flip = el.querySelector('.flipDrop');
  if(face.textContent === n) return;

  flip.textContent = n;

  if(animate){
    el.classList.remove('animate');
    void el.offsetWidth;
    el.classList.add('animate');
    setTimeout(()=>{
      face.textContent = n;
      el.classList.remove('animate');
    },450);
  } else {
    face.textContent = n;
  }
}

function getNow(){return new Date();}
function getParts(){
  let d=getNow();

  if(schoolSync){
    d=new Date(d.getTime()+schoolOffset*1000);
  }

  let h,m,s;

  if(zone==="local"){
    h=d.getHours();
    m=d.getMinutes();
    s=d.getSeconds();
  } else {
    const parts=new Intl.DateTimeFormat('en-US',{
      timeZone:zone,
      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit',
      hourCycle:'h23'
    }).formatToParts(d);
    h=+parts.find(x=>x.type==='hour').value;
    m=+parts.find(x=>x.type==='minute').value;
    s=+parts.find(x=>x.type==='second').value;
  }

  if(!use24) h=h%12||12;

  return [
    String(h).padStart(2,'0'),
    String(m).padStart(2,'0'),
    String(s).padStart(2,'0')
  ];
}

function update(){
  const p=getParts(), value=p.join('');

  /* update tab title */
  document.title = p[0] + ":" + p[1] + (showSeconds ? ":" + p[2] : "");

  const visible=value.slice(0,4)+(showSeconds?p[2]:'');
  digits.forEach((d,i)=>{
    if(i<4 || showSeconds)
      setDigit(d,visible[i]||'0',previous!=="");
  });

  /* tick only when seconds are ON */
  if (showSeconds && previous !== value) tick();
  previous=value;

  document.querySelector('.seconds').style.display=showSeconds?'flex':'none';
  document.querySelector('.secondsSep').style.display=showSeconds?'block':'none';

  document.getElementById('date').style.display=showDate?'block':'none';

  const d=getNow();
  document.getElementById('date').textContent=new Intl.DateTimeFormat('en-US',{
    weekday:'long',month:'long',day:'numeric',year:'numeric',
    timeZone:zone==="local"?undefined:zone
  }).format(d);

  document.getElementById('status').textContent=
    zone==="local" ? "Local time" : zone.replaceAll('_',' ');
}
setInterval(update,1000);
update();

/* BUTTONS */
formatBtn.onclick=()=>{
  use24=!use24;
  formatBtn.textContent=use24?"24-hour":"12 / 24h";
  update();
};
secondsBtn.onclick=()=>{
  showSeconds=!showSeconds;
  secondsBtn.textContent=`Seconds: ${showSeconds?'ON':'OFF'}`;
  update();
};
dateBtn.onclick=()=>{
  showDate=!showDate;
  dateBtn.textContent=`Date: ${showDate?'ON':'OFF'}`;
  update();
};

/* THEME SELECTOR */
const themeSelect=document.getElementById('themeSelect');
const seasonalCanvas=document.getElementById('seasonalCanvas');
const sctx=seasonalCanvas.getContext('2d');
let seasonalParticles=[];

function getSeason(){
  const m=new Date().getMonth()+1;
  if(m>=3 && m<=5) return 'spring';
  if(m>=6 && m<=8) return 'summer';
  if(m>=9 && m<=11) return 'fall';
  return 'winter';
}

function resizeSeasonal(){
  const dpr=Math.min(devicePixelRatio||1,2);
  seasonalCanvas.width=innerWidth*dpr;
  seasonalCanvas.height=innerHeight*dpr;
  seasonalCanvas.style.width=innerWidth+'px';
  seasonalCanvas.style.height=innerHeight+'px';
  sctx.setTransform(dpr,0,0,dpr,0,0);
}

function resetParticles(){
  seasonalParticles=[];
  if(currentSeason==='fall'){
    for(let i=0;i<32;i++) seasonalParticles.push({
      x:Math.random()*innerWidth,y:Math.random()*innerHeight,
      size:4+Math.random()*5,speed:.5+Math.random()*1,
      drift:Math.random()*1.2-.6,rot:Math.random()*6.28,spin:.02-Math.random()*.04
    });
  }
  if(currentSeason==='winter'){
    for(let i=0;i<75;i++) seasonalParticles.push({
      x:Math.random()*innerWidth,y:Math.random()*innerHeight,
      size:2+Math.random()*3,speed:.5+Math.random()*1.2,drift:Math.random()*.5-.25
    });
  }
}

function drawSeason(){
  sctx.clearRect(0,0,innerWidth,innerHeight);
  if(currentTheme!=='seasonal') return;

  if(currentSeason==='summer'){
    sctx.fillStyle='#3f8739'; sctx.fillRect(0,innerHeight*.62,innerWidth,innerHeight*.38);
    sctx.fillStyle='#fff0a0'; sctx.beginPath(); sctx.arc(innerWidth-100,90,38,0,Math.PI*2); sctx.fill();
  }

  if(currentSeason==='spring'){
    sctx.fillStyle='#4b8244'; sctx.fillRect(0,innerHeight*.62,innerWidth,innerHeight*.38);
    [[.14,.38],[.82,.34]].forEach(([px,ph])=>{
      const x=innerWidth*px, top=innerHeight*ph;
      sctx.strokeStyle='#665143'; sctx.lineWidth=8;
      sctx.beginPath(); sctx.moveTo(x,innerHeight*.65); sctx.lineTo(x,top); sctx.stroke();
      sctx.lineWidth=4; sctx.beginPath();
      sctx.moveTo(x,top+45,x-48,top); sctx.moveTo(x,top+35,x+45,top-8); sctx.stroke();
      sctx.fillStyle='#91bd70';
      sctx.beginPath();sctx.arc(x-48,top,5,0,6.28);sctx.fill();
      sctx.beginPath();sctx.arc(x+45,top-8,5,0,6.28);sctx.fill();
    });
  }

  if(currentSeason==='fall'){
    sctx.fillStyle='#704a35'; sctx.fillRect(0,innerHeight*.62,innerWidth,innerHeight*.38);
    seasonalParticles.forEach(p=>{
      sctx.save();sctx.translate(p.x,p.y);sctx.rotate(p.rot);
      sctx.fillStyle=['#b94b32','#d47a2e','#e2a12f'][Math.floor(Math.random()*3)];
      sctx.beginPath();sctx.ellipse(0,0,p.size*.7,p.size,.4,0,6.28);sctx.fill();sctx.restore();
      p.y+=p.speed;p.x+=p.drift+Math.sin(p.y*.02)*.3;p.rot+=p.spin;
      if(p.y>innerHeight+15){p.y=-15;p.x=Math.random()*innerWidth}
    });
  }

  if(currentSeason==='winter'){
    sctx.fillStyle='#fff'; sctx.fillRect(0,innerHeight*.7,innerWidth,innerHeight*.3);
    seasonalParticles.forEach(p=>{
      sctx.fillStyle='rgba(255,255,255,.9)';
      sctx.beginPath();sctx.arc(p.x,p.y,p.size,0,6.28);sctx.fill();
      p.y+=p.speed;p.x+=p.drift;
      if(p.y>innerHeight+8){p.y=-8;p.x=Math.random()*innerWidth}
    });
  }
  requestAnimationFrame(drawSeason);
}

function applyTheme(theme){
  currentTheme=theme;
  document.body.classList.remove('light','space','seasonal','spring','summer','fall','winter');
  if(theme==='light') document.body.classList.add('light');
  if(theme==='space') document.body.classList.add('space');
  if(theme==='seasonal'){
    currentSeason=getSeason();
    document.body.classList.add('seasonal',currentSeason);
    resetParticles();
  }
  themeSelect.value=theme;
}

themeSelect.addEventListener('change',()=>applyTheme(themeSelect.value));
window.addEventListener('resize',()=>{resizeSeasonal();if(currentTheme==='seasonal')resetParticles()});
resizeSeasonal();
applyTheme('default');
requestAnimationFrame(drawSeason);

/* SCHOOL SYNC */
schoolSyncBtn.onclick=()=>{
  schoolSync=!schoolSync;
  schoolSyncBtn.textContent = schoolSync ? "Sync: ON" : "School Clock Sync";
  update();
};

/* SETTINGS PANEL */
settingsBtn.onclick=()=>panel.classList.toggle('open');

/* FULLSCREEN */
fullscreenBtn.onclick=()=>{
  document.fullscreenElement
    ? document.exitFullscreen()
    : document.documentElement.requestFullscreen();
};

/* ACCENT COLOR */
accent.oninput=e=>{
  document.documentElement.style.setProperty('--accent',e.target.value);
};

/* TIME ZONE */
zone.onchange=e=>{
  zone=e.target.value;
  update();
};

/* SCALE */
scale.oninput=e=>{
  document.querySelector('.app').style.transform=`scale(${e.target.value})`;
};

/* STOPWATCH */
let stopwatchRunning=false,swStart=0,swElapsed=0,swInterval;
stopwatchBtn.onclick=()=>{
  if(stopwatchRunning){
    swElapsed+=Date.now()-swStart;
    clearInterval(swInterval);
    stopwatchRunning=false;
    stopwatchBtn.textContent="Stopwatch";
  }else{
    swStart=Date.now();
    stopwatchRunning=true;
    stopwatchBtn.textContent="Stopwatch: Stop";
    swInterval=setInterval(()=>{
      timer.classList.add('show');
      timer.textContent="Stopwatch  "+fmt((swElapsed+Date.now()-swStart)/1000);
    },50);
  }
};
function fmt(x){
  x=Math.floor(x);
  return String(Math.floor(x/3600)).padStart(2,'0')
    +":"+String(Math.floor(x/60)%60).padStart(2,'0')
    +":"+String(x%60).padStart(2,'0');
}

/* COUNTDOWN */
let countdown=false,count=300,countInterval;
countdownBtn.onclick=()=>{
  if(countdown){
    clearInterval(countInterval);
    countdown=false;
    countdownBtn.textContent="Countdown";
    timer.classList.remove('show');
    return;
  }
  const raw=prompt("Countdown seconds:", "300");
  if(raw===null)return;
  count=Math.max(1,parseInt(raw)||300);
  countdown=true;
  timer.classList.add('show');
  countdownBtn.textContent="Countdown: Stop";
  countInterval=setInterval(()=>{
    timer.textContent="Countdown  "+fmt(count);
    if(count<=0){
      clearInterval(countInterval);
      countdown=false;
      countdownBtn.textContent="Countdown";
      beep();
    }
    count--;
  },1000);
};
function beep(){
  try{
    const a = new AudioContext();
    const o = a.createOscillator();
    const g = a.createGain();

    o.connect(g);
    g.connect(a.destination);

    o.frequency.value = 880;     // beep pitch
    g.gain.setValueAtTime(0.08, a.currentTime);

    o.start(a.currentTime);
    o.stop(a.currentTime + 0.3); // clean, non‑clipped beep
  } catch(e) {
    console.error(e);
  }
}
</script>
</body>
</html>
